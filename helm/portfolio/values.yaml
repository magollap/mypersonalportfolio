replicaCount: 2

image:
  repository: ghcr.io/your-account/your-portfolio
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: portfolio.example.com
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

storage:
  enabled: true
  size: 1Gi
  storageClassName: ""

config:
  publicSiteName: Manohar Gollapudi Portfolio

secrets:
  supabaseUrl: ""
  supabaseAnonKey: ""
